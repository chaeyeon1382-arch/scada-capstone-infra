name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/51738235190/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-deploy@project-52d3e61e-2e0d-4571-935.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="vm_deploy_key=${{ secrets.VM_DEPLOY_KEY }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="vm_deploy_key=${{ secrets.VM_DEPLOY_KEY }}"